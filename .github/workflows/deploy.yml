name: Emmichy comparison only - NO DEPLOY
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 3870e45cbe37e8075d782b39f161f23f18551cf0
          path: baseline
      - uses: actions/checkout@v4
        with:
          repository: mukkii-game/emmichy
          ref: eae577bb7898cd96753b249f8b584d910beae909
          path: game
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js
        working-directory: candidate
      - run: node scripts/emmichy-ab.mjs
        working-directory: candidate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          GEMINI_MODEL: gemini-flash-latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emmichy-ab
          path: candidate/artifacts/emmichy-ab.json


name: Emmichy comparison only - NO DEPLOY
on:
  workflow_dispatch:
  push:
    branches: [codex/emmichy-ab-run]
permissions:
  contents: read
jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 3870e45cbe37e8075d782b39f161f23f18551cf0
          path: baseline
      - uses: actions/checkout@v4
        with:
          repository: mukkii-game/emmichy
          ref: 0dbd6a62a7ca97423ea074f976ec0d20cb522311
          path: game
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js
        working-directory: candidate
      - run: node scripts/emmichy-memory-smoke.mjs
        working-directory: candidate
        env:
                    GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          GEMINI_MODEL: gemini-flash-latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emmichy-loop5-smoke
          path: candidate/artifacts/emmichy-loop5-smoke.json




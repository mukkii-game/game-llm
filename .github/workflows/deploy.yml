name: Emmichy comparison only - NO DEPLOY
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 3870e45cbe37e8075d782b39f161f23f18551cf0
          path: baseline
      - uses: actions/checkout@v4
        with:
          repository: mukkii-game/emmichy
          ref: 0d977f7c44821544845498526935b88a5793a70e
          path: game
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js
        working-directory: candidate
      - run: node scripts/emmichy-memory-smoke.mjs
        working-directory: candidate
        env:
          AB_CASES: ordinary
          AB_TURNS: 1
          AB_WAIT_MS: 15000
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          GEMINI_MODEL: gemini-flash-latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emmichy-memory-smoke
          path: candidate/artifacts/emmichy-memory-smoke.json



